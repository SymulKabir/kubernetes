apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panel-profile
  template:
    metadata:
      labels:
        app: panel-profile
    spec:
      containers:
      - name: panel-profile
        image: saimonpranta/panel-49-profile:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3144
---
apiVersion: v1
kind: Service
metadata:
  name: panel-profile-service
spec:
  selector:
    app: panel-profile
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3144
  type: ClusterIP
